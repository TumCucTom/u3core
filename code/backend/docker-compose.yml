version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      - ./logs:/app/logs
      - ./initdb:/initdb
    ports:
      - "3002:3000"
    env_file:
      - ../../../.env  # <-- Will be injected dynamically
    depends_on:
      db:
        condition: service_healthy

  websocket:
    build:
      context: .
      dockerfile: Dockerfile.websocket
    ports:
      - "8080:8080"
    depends_on:
      - backend

  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: mysql_container
    ports:
      - "3307:3306"
    env_file:
      - ../../../.env  # <-- Will be injected dynamically
    volumes:
      - db_data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d
      - ./initdb:/initdb
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 15s
      timeout: 10s
      retries: 15

volumes:
  db_data:
