version: '3.8'

networks:
  mynetwork:

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      - ./logs:/app/logs  # Mount the host machine's ./logs directory to the container
      - ./initdb:/initdb  # This mounts ./host-initdb on the host to /initdb in the container
    ports:
      - "3000:3000"
    env_file:
      - ../../../.env
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mynetwork

  websocket:
    build:
      context: .
      dockerfile: Dockerfile.websocket
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - mynetwork

  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: mysql_container
    ports:
      - "3306:3306"
    env_file:
      - ../../../.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d
      - ./initdb:/initdb  # This mounts ./host-initdb on the host to /initdb in the container
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 15s
      timeout: 10s
      retries: 15
    networks:
      - mynetwork

volumes:
  db_data:
