name: Run Unit Tests and Lint Files

"on":
  push:
    paths:
      - 'code/frontend/web-app/**'
      - '.github/workflows/webApp.yml'

permissions:
  contents: read

jobs:
  built-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install modules
        run: |
          cd code/frontend/web-app
          rm -rf node_modules package-lock.json yarn.lock
          npm install vite@2.9.18 --save-dev
          npm install
      - name: Run web app tests
        run: |
          npm --prefix code/frontend/web-app ci
          npm --prefix code/frontend/web-app run build
          npm --prefix code/frontend/web-app run lint