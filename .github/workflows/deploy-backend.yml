name: Deploy to AWS

on:
  push:
    branches:
      - dev
      - cd-backend
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.AWS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H github.com >> ~/.ssh/known_hosts
        ssh-keyscan -H ${{ secrets.AWS_HOST }} >> ~/.ssh/known_hosts


    - name: Deploy to AWS
      run: |
        ssh -tt ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }} << 'EOF'
          set -e  # Exit on any error
          
          # Install Docker
          sudo yum update -y
          sudo yum install -y docker
          sudo systemctl enable docker
          sudo systemctl start docker

          # Add user to Docker group
          sudo usermod -aG docker $USER
          newgrp docker  # Apply changes immediately

          # Install Docker Compose V2 manually
          mkdir -p ~/.docker/cli-plugins
          curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 -o ~/.docker/cli-plugins/docker-compose
          chmod +x ~/.docker/cli-plugins/docker-compose

          # Ensure GitHub's SSH key is trusted
          mkdir -p ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

          # Navigate to home directory and remove any existing repo
          cd ~
          rm -r 2024-MLAIPredictionMicroservices
  
          # Clone the latest version over SSH
          git clone git@github.com:spe-uob/2024-MLAIPredictionMicroservices.git
          cd 2024-MLAIPredictionMicroservices/code/backend
  
          # Start the service using Docker Compose
          docker compose down
          docker compose pull
          docker compose up -d --build
        EOF

