name: Deploy to AWS

on:
  push:
    branches:
      - dev
      - bug-deploy-aws
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.AWS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H github.com >> ~/.ssh/known_hosts
        ssh-keyscan -H ${{ secrets.AWS_HOST }} >> ~/.ssh/known_hosts


    - name: Deploy to AWS
      run: |
        ssh ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }} << 'EOF'
          set -e  # Exit on any error
          sudo yum update && sudo yum install -y git  # Ensure git is installed
          
          # Navigate to home directory and remove any existing repo
          cd ~
          rm -rf 2024-MLAIPredictionMicroservices

          # Clone the latest version
          git clone -b bug-deploy-aws git@github.com:spe-uob/2024-MLAIPredictionMicroservices.git
          cd 2024-MLAIPredictionMicroservices/code/backend

          # Start the service using Docker Compose
          docker compose down
          docker compose pull
          docker compose --env-file ../../../.env up -d --build
    - name: Wait for container to be ready
      run: |
          timeout=60
          while [ $timeout -gt 0 ]; do
            if docker logs backend-backend-1 2>&1 | grep -q "Database connection successful!"; then
              echo "Container is ready!"
              exit 0
            fi
            sleep 2
            timeout=$((timeout-2))
          done
          echo "Timeout waiting for container readiness."
          exit 1
