name: webServer

"on":
  push:
    paths:
      - 'code/backend/web-server/**'
      - '.github/workflows/webServer.yml'

permissions:
  contents: read

env:
  NODE_VERSION: 16

jobs:
  linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Install NodeJS
        uses: actions/setup-node@v2
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Code Checkout
        uses: actions/checkout@v2

      - name: Install Dependencies
        run: |
          npm --prefix code/backend/web-server ci
          npm --prefix code/backend/web-server i -S mysql2 bcrypt cors nodemailer
      - name: Code Linting
        run: npm --prefix code/backend/web-server run lint